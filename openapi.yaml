openapi: 3.0.0
info:
  title: SiteFlow Ensemble Engine API
  version: 1.0.0
  description: API for ensemble forecasting of construction sites.
servers:
  - url: http://localhost:3000
paths:
  /forecast:
    get:
      summary: Get ensemble forecast for a construction site
      parameters:
        - name: site_id
          in: query
          required: true
          schema:
            type: integer
          description: Site ID for which to generate the forecast
      responses:
        '200':
          description: Successful forecast response
          content:
            application/json:
              schema:
                type: object
                properties:
                  site_id:
                    type: integer
                  forecasts:
                    type: array
                    items:
                      type: object
                      properties:
                        model:
                          type: string
                        prediction:
                          type: number
                  ensemble:
                    type: number
        '400':
          description: Invalid request
        '500':
          description: Internal server error
